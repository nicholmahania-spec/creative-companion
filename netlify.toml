# Creative Companion — Netlify SPA deploy
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # NETLIFY IS RETIRED. Its last successful deploy was 2026-07-19 and
  # creativecompanion.netlify.app now 404s. Production is Vercel — see the
  # deploy registry, src/lib/deploy/deployTargets.js, which is what the app
  # and the proxy both read. This file is kept only so the config does not
  # have to be rebuilt if the host is ever revived; it is not a live target.
  #
  # Stays at 24 deliberately. Node 26 is proven green on GitHub Actions (unit,
  # e2e, verify-project) but nothing exercises Netlify's build image on a pull
  # request, so raising this is only ever verified in production — and Vercel
  # rejected 26 outright ("invalid or discontinued Node.js Version"), so the
  # failure mode is real, not hypothetical.
  NODE_VERSION = "24"

# Helper AI proxy (set XAI_API_KEY in Netlify env — not VITE_*)
[[redirects]]
  from = "/api/xai/chat/completions"
  to = "/.netlify/functions/xai-proxy"
  status = 200
  force = true

# SPA: all routes → index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=*, payment=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.supabase.co https://api.x.ai https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# HTML / SW: always revalidate (stale shell risk)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed Vite assets: long cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
