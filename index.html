<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070B14" />
    <meta
      name="description"
      content="Creative Companion — a body-double desk for designers with ADHD. One next design step, a Helper that stays with you, and a brand pack you can ship."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <!-- %BASE_URL%, not "./". Vite rewrites the icon hrefs above but leaves
      the manifest link alone, so a relative path resolved against the CURRENT
      ROUTE: on a client deep link like /c/:portalId the browser asked for
      /c/manifest.webmanifest, got the SPA fallback (HTML), and Add to Home
      Screen broke on every shared link, on all three hosts. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Creative Companion — one next design step</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only Plus Jakarta Sans (the UI font) loads render-blocking on every
         visit. The seven display families the Brand Book Builder offers
         (DM Sans, Fraunces, Lato, Libre Baskerville, Playfair Display,
         Source Sans 3, Space Grotesk) are fetched on demand by
         src/lib/fontLoader.js when that lazy view/type picker needs them —
         no reason to block first paint of the login/app for fonts one
         lazy route uses. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- The transient layer's home: a SIBLING of #root, never a descendant.
         An open Workroom stage sets #root to inert + aria-hidden +
         visibility:hidden, which is deliberate — but it also reached every
         toast, undo chip and dialog the app renders, so an undo offered from
         inside a stage was invisible and a full-viewport Export dialog opened
         at 1280x720 that nobody could see. Anything that must outrank the
         stage lives here instead.
         Never give this node transform / filter / perspective / contain /
         will-change: any of them makes it the containing block for its
         position:fixed children and collapses them into its own box. -->
    <div id="cc-overlay-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
