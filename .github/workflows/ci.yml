name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runs pile up otherwise. Neither workflow had a concurrency group, so four
# pushes to a branch left four live runs of each workflow competing for the
# same runners — and a job that waits too long for one is cancelled, which
# reports as a red X indistinguishable from a real failure. Two such
# cancellations on 2026-08-06 (main's e2e, this branch's verify-project) were
# each ~15 minutes of queueing, zero failed jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      # Lint before the suite, because it catches a class the suite cannot:
      # a free identifier crashes at render, and nothing in vitest renders the
      # views. `projectPalette is not defined` shipped past a clean build and
      # 905 green tests; `appUrl is not defined` had been breaking password
      # reset for who knows how long. Ratcheted rather than zero — see
      # scripts/lint-ratchet.mjs for why, and for how to satisfy it.
      - run: npm run lint:ratchet
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - run: npm run test:perf

      # Guard the public deep links (/f/:id, /c/:id). Relative asset URLs
      # resolve against the current route, so './assets/...' 404s on any
      # deep link and the app boots to a blank page — invisible until a
      # client actually clicks their link. Netlify build must be root-absolute.
      - name: Netlify build uses root-absolute asset URLs
        run: |
          npm run build
          if grep -q 'src="\./assets/' dist/index.html; then
            echo "::error::vite base is relative — deep links (/c/:id) will break. Use '/' not './'."
            exit 1
          fi
          echo "OK: assets are root-absolute"

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.2.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: true
