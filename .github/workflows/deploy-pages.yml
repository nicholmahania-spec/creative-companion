# Build Vite app and publish to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # Full history so git rev-list --count gives a stable build version
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '26'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # GitHub Pages has no SPA rewrite (public/_redirects is Netlify/
      # Cloudflare-only), so a deep link like /creative-companion/c/<id>
      # would 404. Pages serves 404.html for unknown paths — making it a
      # copy of index.html boots the app, which then reads the real path
      # and renders the public client page.
      - name: SPA fallback for deep links (/f/:id, /c/:id)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
